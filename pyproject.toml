[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-forge"
version = "0.2.0"
description = "Gymnasium environment for learning hardware-aware quantum circuit synthesis"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Moudather Chelbi" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "gymnasium>=0.29",
    "numpy>=1.24",
    "qiskit>=1.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
aer = ["qiskit-aer>=0.13"]
cirq = ["cirq-core>=1.3"]
viz = ["matplotlib>=3.7"]
rl = ["stable-baselines3>=2.0", "torch>=2.0", "optuna>=3.0"]
dev = ["pytest>=7.0", "qiskit-aer>=0.13", "cirq-core>=1.3", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/vinerya/quantum_forge"

[tool.setuptools]
packages = ["quantum_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
